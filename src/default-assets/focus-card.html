<div class="uptrack-focus-card">
  <div class="uptrack-focus-card-header">
    <a
      class="uptrack-focus-card-title"
      x-bind:href="route.url || false"
      x-text="route.title"
      x-bind:class="route.url ? '' : 'no-link'"
    ></a>
    <button
      type="button"
      aria-label="Close"
      class="uptrack-focus-card-close-button"
      x-on:click="card.close()"
    >
      &#10005;
    </button>
  </div>
  <div>
    <ul>
      <li>
        <span>Duration:</span>
        <span x-text="route.durationValue"></span>
        <span x-text="route.durationUnit"></span>
      </li>
      <li>
        <span>Elevation Gain:</span> <span x-text="route.elevationGain"></span>
        <span>m</span>
      </li>
      <li>
        <span>Elevation Range:</span>
        <span x-text="route.elevationRangeStart"></span>
        <span>-</span>
        <span x-text="route.elevationRangeEnd"></span>
        <span>m</span>
      </li>
      <li>
        <span>Distance:</span> <span x-text="route.distanceKm"></span>
        <span>km</span>
      </li>
      <li><span>Difficulty:</span> <span x-text="route.difficulty"></span></li>
    </ul>
  </div>
</div>
